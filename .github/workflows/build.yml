name: Build & Deploy iOS App (TestFlight)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: flutter analyze lib/ test/ --no-fatal-warnings --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build-ios:
    name: Build & Upload iOS to TestFlight
    needs: [code-quality]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          python3 -c "import os, base64; raw = os.environ.get('PROVISION_PROFILE_BASE64', '').strip().encode('utf-8').decode('utf-8-sig').strip(); data = base64.b64decode(raw); p = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles'); open(os.path.join(p, 'TigerBay_AppStore.mobileprovision'), 'wb').write(data); open(os.path.join(p, '2109fcf1-25d1-4895-9c6b-a800a20f3c63.mobileprovision'), 'wb').write(data)"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Flutter Build iOS (compile only, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Xcode Archive (sign with our certificate)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/TigerBay.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="TigerBay AppStore" \
            DEVELOPMENT_TEAM=ZDZ58YL7Y3 \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Xcode Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/TigerBay.xcarchive \
            -exportPath $RUNNER_TEMP/TigerBay_IPA \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Locate Exported IPA
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/TigerBay_IPA -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_FILE"
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload iOS Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-ios-signed-ipa
          path: ${{ env.IPA_PATH }}

      - name: Upload to Apple TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
