name: Build App (Android, iOS & Web)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: flutter analyze lib/ test/

      - name: Run Unit Tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Ensure gradlew is executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi


      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP compatibility
        run: |
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + 2>/dev/null || true


      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA & App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No codesign for testing)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa File
        run: |
          mkdir -p build/ios/ipa_out/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_out/Payload/
          cd build/ios/ipa_out
          zip -qr TigerBay.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-ios-ipa
          path: build/ios/ipa_out/TigerBay.ipa

      - name: Upload iOS Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-ios-runner-app
          path: build/ios/iphoneos/Runner.app

  build-web:
    name: Build Web App (Safari / Chrome preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-web-build
          path: build/web
