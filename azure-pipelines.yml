# ═══════════════════════════════════════════════════════════════════════════
# TigerBay International — Azure DevOps CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════
trigger:
  branches:
    include:
      - main
      - master
  tags:
    include:
      - v*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: tigerbay-production-variables # Azure DevOps Variable Group
  - name: FLUTTER_CHANNEL
    value: 'stable'

stages:
  - stage: Quality
    displayName: 'Quality & Test Gate'
    jobs:
      - job: LintAndTest
        displayName: 'Analyze & Unit Tests'
        steps:
          - task: FlutterInstall@0
            inputs:
              mode: 'auto'
              channel: '$(FLUTTER_CHANNEL)'
            displayName: 'Install Flutter'

          - script: flutter pub get
            displayName: 'Install Dependencies'

          - script: flutter analyze lib/ test/
            displayName: 'Run Dart Analyzer'

          - script: flutter test
            displayName: 'Run Automated Tests'

  - stage: BuildAndDeploy
    displayName: 'Production Build & Azure Deploy'
    dependsOn: Quality
    condition: succeeded()
    jobs:
      - job: BuildWeb
        displayName: 'Build Flutter Web'
        steps:
          - task: FlutterInstall@0
            inputs:
              mode: 'auto'
              channel: '$(FLUTTER_CHANNEL)'

          - script: flutter pub get
            displayName: 'Install Dependencies'

          - script: |
              flutter build web --release \
                --dart-define=SUPABASE_URL="$(SUPABASE_URL)" \
                --dart-define=SUPABASE_ANON_KEY="$(SUPABASE_ANON_KEY)" \
                --dart-define=STRIPE_PUBLISHABLE_KEY="$(STRIPE_PUBLISHABLE_KEY)" \
                --dart-define=STRIPE_SECRET_KEY="$(STRIPE_SECRET_KEY)" \
                --dart-define=GOOGLE_WEB_CLIENT_ID="$(GOOGLE_WEB_CLIENT_ID)" \
                --dart-define=APP_SCHEME="$(APP_SCHEME)" \
                --dart-define=APP_ENV="production"
            displayName: 'Compile Production Flutter Web Bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/build/web'
              artifact: 'tigerbay-web-bundle'
            displayName: 'Publish Web Artifact'
