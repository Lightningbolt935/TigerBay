name: tigerbay_app
description: TigerBay International Member Loyalty App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Payments
  flutter_stripe: ^11.0.0

  # Auth (Social)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # QR Code
  qr_flutter: ^4.1.0

  # Fonts (no local TTF needed - downloads automatically)
  google_fonts: ^6.2.1

  # UI & Utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.5
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Env
  flutter_dotenv: ^5.1.0

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
