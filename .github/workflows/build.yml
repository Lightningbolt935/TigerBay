name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: flutter analyze lib/ test/ --no-fatal-warnings --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build-ios:
    name: Build iOS IPA
    needs: [code-quality]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No codesign for testing)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa File
        run: |
          mkdir -p build/ios/ipa_out/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_out/Payload/
          cd build/ios/ipa_out
          zip -qr TigerBay.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-ios-ipa
          path: build/ios/ipa_out/TigerBay.ipa
