name: Production Release & Azure Deployment

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: 'Deploy Web to Azure Static Web Apps'
        required: false
        default: true
        type: boolean

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Quality Gate: Linting & Automated Tests
  # ═══════════════════════════════════════════════════════════════════════════
  quality-gate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze lib/ test/

      - name: Run Automated Unit Tests
        run: flutter test --coverage

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Build Android Production (APK & App Bundle .aab)
  # ═══════════════════════════════════════════════════════════════════════════
  build-android-production:
    name: Build Android (APK & AAB)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP compatibility
        run: |
          find ~/.pub-cache -name "build.gradle" -type f -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + 2>/dev/null || true


      - name: Build Android Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_SCHEME: ${{ secrets.APP_SCHEME }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY}" \
            --dart-define=PAYPAL_CLIENT_ID="${PAYPAL_CLIENT_ID}" \
            --dart-define=PAYPAL_CLIENT_SECRET="${PAYPAL_CLIENT_SECRET}" \
            --dart-define=PAYPAL_MODE="${PAYPAL_MODE:-live}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=APP_SCHEME="${APP_SCHEME:-io.tigerbay.app}" \
            --dart-define=APP_ENV=production

      - name: Build Android App Bundle (Google Play Store)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_SCHEME: ${{ secrets.APP_SCHEME }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY}" \
            --dart-define=PAYPAL_CLIENT_ID="${PAYPAL_CLIENT_ID}" \
            --dart-define=PAYPAL_CLIENT_SECRET="${PAYPAL_CLIENT_SECRET}" \
            --dart-define=PAYPAL_MODE="${PAYPAL_MODE:-live}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=APP_SCHEME="${APP_SCHEME:-io.tigerbay.app}" \
            --dart-define=APP_ENV=production

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-android-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Build & Deploy Flutter Web to Azure Static Web Apps
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-azure-web:
    name: Build & Deploy Web (Azure)
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Production Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_SCHEME: ${{ secrets.APP_SCHEME }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY}" \
            --dart-define=PAYPAL_CLIENT_ID="${PAYPAL_CLIENT_ID}" \
            --dart-define=PAYPAL_CLIENT_SECRET="${PAYPAL_CLIENT_SECRET}" \
            --dart-define=PAYPAL_MODE="${PAYPAL_MODE:-live}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=APP_SCHEME="${APP_SCHEME:-io.tigerbay.app}" \
            --dart-define=APP_ENV=production

      - name: Copy Azure SWA Config into Output
        run: |
          if [ -f web/staticwebapp.config.json ]; then
            cp web/staticwebapp.config.json build/web/
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-web-production-bundle
          path: build/web

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'build/web'
          skip_app_build: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Build iOS Release Bundle
  # ═══════════════════════════════════════════════════════════════════════════
  build-ios-production:
    name: Build iOS App & IPA
    needs: quality-gate
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          python3 -c "import os, base64; raw = os.environ.get('PROVISION_PROFILE_BASE64', '').strip().encode('utf-8').decode('utf-8-sig').strip(); data = base64.b64decode(raw); p = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles'); open(os.path.join(p, 'TigerBay_AppStore.mobileprovision'), 'wb').write(data); open(os.path.join(p, '2109fcf1-25d1-4895-9c6b-a800a20f3c63.mobileprovision'), 'wb').write(data)"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/


      - name: Flutter Build iOS (compile only, no codesign)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_SCHEME: ${{ secrets.APP_SCHEME }}
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY}" \
            --dart-define=PAYPAL_CLIENT_ID="${PAYPAL_CLIENT_ID}" \
            --dart-define=PAYPAL_CLIENT_SECRET="${PAYPAL_CLIENT_SECRET}" \
            --dart-define=PAYPAL_MODE="${PAYPAL_MODE:-live}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=APP_SCHEME="${APP_SCHEME:-io.tigerbay.app}" \
            --dart-define=APP_ENV=production

      - name: Xcode Archive (sign with our certificate)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/TigerBay.xcarchive \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Xcode Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/TigerBay.xcarchive \
            -exportPath $RUNNER_TEMP/TigerBay_IPA \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload iOS Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-ios-signed-ipa
          path: ${{ runner.temp }}/TigerBay_IPA/*.ipa

      - name: Locate Exported IPA
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/TigerBay_IPA -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_FILE"
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload to Apple TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
