name: Build App (Web)

on:
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: flutter analyze lib/ test/

      - name: Run Unit Tests
        run: flutter test

  build-web:
    name: Build & Package Web App
    needs: [code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Prepare .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Create Web ZIP
        run: |
          cd build/web
          zip -r ../../tigerbay-web.zip .

      - name: Upload Web ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerbay-web
          path: tigerbay-web.zip
          if-no-files-found: error
          retention-days: 30
